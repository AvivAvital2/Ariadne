# Built-in corpus recipe for `ariadne spools create terraform`.
# Curation per design §18.1 (admit iff real code corpus AND SCIP-translatable).
#
# Terraform is a single-repo Go environment. The corpus is sourced from
# OpenTofu (github.com/opentofu/opentofu), NOT hashicorp/terraform: since
# Aug 2023 Terraform ships under the Business Source License (BUSL 1.1), which
# is source-available, NOT open source, and does not permit redistributing
# derived artifacts under an open-source claim. OpenTofu is the MPL 2.0,
# Linux-Foundation-governed drop-in fork — same HCL, same providers, same
# runtime concepts — so a pack built from it describes the identical Terraform
# environment while staying redistribution-safe. Indexed by scip-go.
#
# Unlike Databricks (a DBR runtime governing several repos), there is no
# separate "runtime edition" — the release version you pick at `create` time
# becomes the pack edition, so this recipe declares no `runtime:` and no `tag:`
# (chosen interactively from the live release tags, so it stays current and
# valid). Requires scip-go on PATH:
#   go install github.com/scip-code/scip-go/cmd/scip-go@latest
name: terraform
version: 1.0.0
# Corpus language — Go, indexed by scip-go (checked by the grounding gate).
languages: [go]
corpus:
  opentofu:
    url: https://github.com/opentofu/opentofu
# certify: (optional) publisher-certified doc dirs, e.g. opentofu/website/docs/
