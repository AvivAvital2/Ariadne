# Built-in corpus recipe for `ariadne spools create terraform`.
# Curation per design §18.1 (admit iff real code corpus AND SCIP-translatable).
#
# Terraform is a single-repo Go environment: the corpus IS hashicorp/terraform,
# indexed by scip-go. Unlike Databricks (a DBR runtime governing several repos),
# there is no separate "runtime edition" — the release version you pick at
# `create` time becomes the pack edition, so this recipe declares no `runtime:`
# and no `tag:` (chosen interactively from the live release tags, so it stays
# current and valid). Requires scip-go on PATH:
#   go install github.com/scip-code/scip-go/cmd/scip-go@latest
name: terraform
version: 1.0.0
# Corpus language — Go, indexed by scip-go (checked by the grounding gate).
languages: [go]
corpus:
  terraform:
    url: https://github.com/hashicorp/terraform
# certify: (optional) publisher-certified doc dirs, e.g. terraform/website/docs/
