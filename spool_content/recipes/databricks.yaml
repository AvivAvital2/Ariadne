# Built-in corpus recipe for `ariadne spools init databricks`.
# Curation per design §18.1 (admit iff real code corpus AND SCIP-translatable),
# pins blessed by the user 2026-07-08; missing shas are resolved from the tags
# at `spools create` time, shown in the consent prompt, and pinned back into
# the generated spools.yaml (TOFU).
name: databricks
runtime: dbr17.3-lts
version: 1.0.0
# Corpus languages — each must have a registered SCIP indexer or `create`
# refuses up front (a Spool needs code-tier grounding; §18.1). python + scala
# (pyspark interface + Spark's Scala implementation) are both SCIP-indexable.
languages: [python, scala]
# Multi-word product-name forms the router must treat as the environment's
# OWN names (route-don't-admit): not derivable from the component keys.
name_aliases:
  - delta lake
  - apache spark
# The runtime edition's component versions — the corpus pins below match
# them by construction. Keys = corpus repo dirs (how version facts attribute
# their component); rides the pack manifest as runtime_components and powers
# the deterministic "is X available on MY runtime" availability join.
runtime_components:
  spark: '4.0.0'
  delta: '4.0.0'
  databricks-sdk-py: '0.121.0'
corpus:
  spark:
    url: https://github.com/apache/spark
    tag: v4.0.0
  databricks-sdk-py:
    url: https://github.com/databricks/databricks-sdk-py
    tag: v0.121.0        # the sdk release bundled with DBR 17.3 LTS
  delta:
    url: https://github.com/delta-io/delta
    tag: v4.0.0          # Delta 4.0 tracks Spark 4.0.0
certify:
  - spark/docs/
  - databricks-sdk-py/docs/
  - delta/docs/
# The databricks expert's advisory lens (designs/spool-expert-aisles.md §2):
# concern/opportunity/gotcha dimensions applied to a caller's code when this
# aisle is consulted. Concerns/opportunities: distributing local work, row-wise
# vs vectorized, avoiding driver-side collects; gotchas: MLflow autolog
# silently patching sklearn.fit (catastrophic training slowdown on Spark),
# data skew.
taxonomy:
  - parallelism
  - cross-row-deps
  - engine-coupling
  - serialization
  - autolog-patching
  - data-skew
  - collect-misuse
# Interaction surfaces: surface name → keyword STEMS, matched
# word-start-bounded ('serializ' hits serialization/serializer, never
# mid-word). The build's tag pass marks doc-grade docs, the pack ships the
# tags, and the consumer matches questions against these same stems to scope
# the no-crisp semantic fallback. Refine freely — re-tagging is idempotent.
surfaces:
  serialization:
    - serializ
    - deserializ
    - pickle
    - kryo
    - arrow
    - encoder
    - udf
  parallelism:
    - parallel
    - concurren
    - partition
    - repartition
    - shuffle
    - executor
    - coalesc
  io:
    - checkpoint
    - stream
    - reader
    - writer
    - ingest
    - connector
  memory:
    - memory
    - cache
    - spill
    - persist
    - broadcast
    - oom
  state:
    - stateful
    - watermark
  lifecycle:
    - deprecat
    - migrat
    - upgrad
    - versio
    - lifecycl
