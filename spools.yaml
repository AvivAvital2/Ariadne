name: databricks
runtime: dbr17.3-lts
version: 1.0.0
languages:
- python
- scala
# The runtime edition's component versions (confirmed 2026-07-27) — the
# corpus pins below were chosen to match the runtime, so these ARE the
# runtime's components by construction. Keys = corpus repo dirs (how
# version facts attribute their component); rides the pack manifest as
# runtime_components and powers the deterministic availability join.
runtime_components:
  spark: '4.0.0'
  delta: '4.0.0'
  databricks-sdk-py: '0.121.0'
# Interaction surfaces (PROVISIONAL, hand-drafted): surface name → keyword
# STEMS, matched word-start-bounded ('serializ' hits serialization/serializer,
# never mid-word). The build's tag pass marks doc-grade docs, the pack ships
# the tags, and the consumer matches questions against these same stems to
# scope the no-crisp semantic fallback. The embedding-vs-descriptor tagger is
# the documented upgrade path; refine stems freely — re-tagging is idempotent.
surfaces:
  serialization:
    - serializ
    - deserializ
    - pickle
    - kryo
    - arrow
    - encoder
    - udf
  parallelism:
    - parallel
    - concurren
    - partition
    - repartition
    - shuffle
    - executor
    - coalesc
  io:
    - checkpoint
    - stream
    - reader
    - writer
    - ingest
    - connector
  memory:
    - memory
    - cache
    - spill
    - persist
    - broadcast
    - oom
  state:
    - stateful
    - watermark
  lifecycle:
    - deprecat
    - migrat
    - upgrad
    - versio
    - lifecycl
corpus:
  spark:
    url: https://github.com/apache/spark
    tag: v4.0.0
    sha: fa33ea000a0bda9e5a3fa1af98e8e85b8cc5e4d4
  databricks-sdk-py:
    url: https://github.com/databricks/databricks-sdk-py
    tag: v0.121.0
    sha: e25671d923ab61926a3716700049ac4776cc4491
  delta:
    url: https://github.com/delta-io/delta
    tag: v4.0.0
    sha: 6d055c5c8a2e16bbf4458268a1bc271c7afcc4d2
certify:
- spark/docs/
- databricks-sdk-py/docs/
- delta/docs/
