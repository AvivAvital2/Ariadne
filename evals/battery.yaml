# Retrieval battery: consumer-archetype matrix vs the Databricks
# environment (built from the shipped dbr17.3-lts recipe — Spark 4.0.0,
# Delta 4.0.0, databricks-sdk-py 0.121.0 at pinned SHAs).
#
# Row classes follow the archetype model (see RESULTS.md): each archetype
# contributes seam/target/version rows where the environment MUST speak
# (with auditable ground-truth title criteria) and control rows where it
# MUST stay silent — including the saturated controls, where the question
# is about the consumer's own code but phrased in vocabulary the
# environment also owns. `consumer` names the fixture source the query is
# scored against.
battery:
  # --- peripheral: harvest runs one Spark ingest job at the edge; its
  # prose is deliberately saturated with the environment's names ---
  - label: P-seam-serialization
    archetype: peripheral
    consumer: harvest
    want: speak
    question: >-
      What should I watch out for when shipping data and Python objects to
      Spark workers in our ingest job?
    ground_truth:
      title_contains: [serializ, pickle, tuning]
  - label: P-target-concurrency
    archetype: peripheral
    consumer: harvest
    want: speak
    question: >-
      How does Delta Lake handle two jobs writing to the same table at the
      same time?
    ground_truth:
      title_contains: [concurren, conflict, isolation]
  - label: P-version-liquid
    archetype: peripheral
    consumer: harvest
    want: speak
    question: Can I use liquid clustering on my Databricks runtime?
    ground_truth:
      title_contains: [liquid, cluster]
  - label: P-control-saturated
    archetype: peripheral
    consumer: harvest
    want: silent
    question: >-
      How does our nightly Spark run decide which regions go into the
      yield report?
  - label: P-control-domain
    archetype: peripheral
    consumer: harvest
    want: silent
    question: How do we render the regional yield summary text?
  - label: P-nonsense
    archetype: peripheral
    consumer: harvest
    want: silent
    question: How do I configure the office coffee machine?

  # --- adopter: featureflow is a local csv/duckdb pipeline with ZERO
  # environment calls; questions probe the migration seam ---
  - label: A-equivalence
    archetype: adopter
    consumer: featureflow
    want: speak
    question: >-
      What is the Databricks equivalent of running local columnar SQL over
      parquet files?
    ground_truth:
      title_contains: [sql, dataframe, parquet]
  - label: A-migration
    archetype: adopter
    consumer: featureflow
    want: speak
    question: >-
      How do I run an existing Python feature pipeline as a Databricks job?
    ground_truth:
      title_contains: [job, submit, workflow]
  - label: A-control-saturated
    archetype: adopter
    consumer: featureflow
    want: silent
    question: >-
      How does our pipeline partition feature computation across rows?

  # --- integrated: lakerun builds on Spark/Delta surfaces (broadcast
  # joins, Delta writes, OPTIMIZE/VACUUM maintenance) ---
  - label: I-seam-broadcast
    archetype: integrated
    consumer: lakerun
    want: speak
    question: >-
      When should our dimension join use a broadcast instead of a shuffle?
    ground_truth:
      title_contains: [broadcast, join, tuning]
  - label: I-target-vacuum
    archetype: integrated
    consumer: lakerun
    want: speak
    question: >-
      What does VACUUM actually delete, and when does it break time travel?
    ground_truth:
      title_contains: [vacuum, retention, time travel]
  - label: I-control-domain
    archetype: integrated
    consumer: lakerun
    want: silent
    question: How do we decide which tables get compacted after a batch?
