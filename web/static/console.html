<!DOCTYPE html>
<!--
  Ariadne Ask console (Phase 2). A pure client of the web backend's MCP-forward
  endpoints: POST /api/ask, /api/search, /api/feedback. Served as a static file
  (/static/console.html) — no server-side change. Design follows the mock
  (designs/web-ui/mock-console.html) Ask view; the sidebar/tabs of the full
  console are a later phase. No fabricated data — empty/loading/error are real.
-->
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ariadne · Ask</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg-0:#080d1c; --bg-1:#0c1430; --bg-2:#101c3c; --bg-3:#16244c;
  --border:#1e2d54; --text:#e9eefb; --muted:#8a97bb; --faint:#5b688c;
  --gold:#ffc24d; --gold-dim:#c8922f; --gold-soft:rgba(255,194,77,.13);
  --cyan:#4fd1e0; --cyan-soft:rgba(79,209,224,.12);
  --green:#4ad6a0; --red:#ff7a8a;
  --shadow:0 10px 40px -12px rgba(0,0,0,.6); --radius:14px;
}
:root[data-theme="light"]{
  --bg-0:#f4f6fc; --bg-1:#fff; --bg-2:#fff; --bg-3:#eef2fb;
  --border:#e2e8f5; --text:#15203c; --muted:#5a688c; --faint:#9aa6c4;
  --gold:#cf8a0c; --gold-dim:#b5790a; --gold-soft:rgba(207,138,12,.10);
  --cyan:#0e93a6; --cyan-soft:rgba(14,147,166,.10);
  --green:#0f9e74; --red:#d94b5e; --shadow:0 10px 30px -14px rgba(40,60,110,.25);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  background:radial-gradient(1200px 700px at 78% -8%,rgba(79,209,224,.07),transparent 60%),
             radial-gradient(900px 600px at 8% 0%,rgba(255,194,77,.06),transparent 55%),var(--bg-0);
  color:var(--text);font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased;
  display:flex;flex-direction:column;height:100vh;overflow:hidden;
}
code,.mono{font-family:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace}
::selection{background:var(--gold-soft)}

.topbar{display:flex;align-items:center;gap:14px;padding:13px 24px;border-bottom:1px solid var(--border);background:rgba(8,13,28,.55);backdrop-filter:blur(8px)}
:root[data-theme="light"] .topbar{background:rgba(255,255,255,.7)}
.brand{display:flex;align-items:center;gap:11px}
.brand .mark{width:32px;height:32px;flex:none;border-radius:9px;background:radial-gradient(circle,#0e1b3d,#050a18);border:1px solid var(--border);overflow:hidden}
.brand .name{font-weight:800;letter-spacing:.14em;font-size:14px}
.brand .name b{color:var(--gold)}
.grow{flex:1}
.pill{display:flex;align-items:center;gap:7px;padding:7px 12px;border:1px solid var(--border);border-radius:9px;background:var(--bg-2);font-size:12.5px;color:var(--muted)}
.pill .dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green)}
.seg{display:flex;border:1px solid var(--border);border-radius:9px;overflow:hidden;font-size:12.5px;font-weight:600}
.seg button{background:transparent;border:none;color:var(--muted);padding:7px 13px;cursor:pointer;transition:.12s;font-family:inherit}
.seg button.on{background:var(--cyan-soft);color:var(--text)}
.iconbtn{width:36px;height:36px;border:1px solid var(--border);border-radius:9px;background:var(--bg-2);color:var(--muted);cursor:pointer;font-size:15px;display:flex;align-items:center;justify-content:center}
.iconbtn:hover{color:var(--text);border-color:var(--gold-dim)}

.content{flex:1;overflow-y:auto;padding:26px 30px 60px;max-width:1160px;width:100%;margin:0 auto}
.content::-webkit-scrollbar{width:11px}.content::-webkit-scrollbar-thumb{background:var(--border);border-radius:8px}

.hero{position:relative;border:1px solid var(--border);border-radius:18px;overflow:hidden;background:linear-gradient(160deg,var(--bg-2),var(--bg-1));margin-bottom:22px}
.hero .inner{position:relative;padding:30px 30px 26px;max-width:820px}
.hero h1{font-size:25px;font-weight:800;letter-spacing:-.01em;margin-bottom:6px}
.hero h1 .thread{color:var(--gold)}
.hero p.sub{color:var(--muted);margin-bottom:20px;max-width:600px}
.askbox{display:flex;align-items:center;gap:12px;padding:11px 12px 11px 18px;border:1px solid var(--border);border-radius:13px;background:var(--bg-0)}
.askbox:focus-within{border-color:var(--gold-dim)}
.askbox input{flex:1;font-size:15.5px;color:var(--text);font-weight:500;background:transparent;border:none;outline:none;font-family:inherit}
.askbox .go{background:var(--gold);color:#1a1206;border:none;border-radius:9px;padding:10px 16px;font-weight:700;cursor:pointer;font-size:13px;font-family:inherit;white-space:nowrap}
.askbox .go:hover{filter:brightness(1.06)}
.askbox .go:disabled{opacity:.5;cursor:default}
.chips{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.chip{font-size:12px;color:var(--muted);border:1px dashed var(--border);border-radius:20px;padding:5px 12px;cursor:pointer;transition:.12s}
.chip:hover{border-color:var(--cyan);color:var(--text)}

.status{padding:20px 4px;color:var(--muted)}
.status.err{color:var(--red)}
.spin{display:inline-block;width:13px;height:13px;border:2px solid var(--border);border-top-color:var(--gold);border-radius:50%;animation:spin .8s linear infinite;vertical-align:-2px;margin-right:8px}
@keyframes spin{to{transform:rotate(360deg)}}

.answer-grid{display:grid;grid-template-columns:1fr 320px;gap:20px}
@media(max-width:1180px){.answer-grid{grid-template-columns:1fr}}
.card{border:1px solid var(--border);border-radius:var(--radius);background:var(--bg-2);box-shadow:var(--shadow)}
.answer{padding:22px 24px}
.answer .meta{display:flex;align-items:center;gap:10px;margin-bottom:14px;font-size:12px;flex-wrap:wrap}
.badge{display:inline-flex;align-items:center;gap:6px;border-radius:20px;padding:3px 10px;font-weight:600;font-size:11.5px}
.badge.conf-high{background:var(--green);color:#04120c}
.badge.conf-medium{background:var(--gold);color:#1a1206}
.badge.conf-low{background:var(--bg-3);color:var(--muted);border:1px solid var(--border)}
.badge.role{background:var(--cyan-soft);color:var(--cyan);border:1px solid var(--cyan)}
.badge.dt{background:var(--gold-soft);color:var(--gold);border:1px solid var(--gold-dim)}
.answer p{margin:0 0 13px;color:#d7deef}
:root[data-theme="light"] .answer p{color:#2b3656}
.answer b{color:var(--text);font-weight:700}
.answer code{background:var(--bg-0);border:1px solid var(--border);border-radius:5px;padding:1px 5px;font-size:12.5px}
.nudge{margin-top:6px;font-size:12.5px;color:var(--cyan)}
.provenance{display:flex;align-items:center;gap:14px;margin-top:8px;padding-top:16px;border-top:1px solid var(--border);font-size:12px;color:var(--faint);flex-wrap:wrap}
.fb{display:flex;gap:8px;margin-left:auto}
.fb button{border:1px solid var(--border);background:var(--bg-1);color:var(--muted);border-radius:8px;padding:6px 11px;cursor:pointer;font-size:12px;font-weight:600;font-family:inherit}
.fb button:hover{border-color:var(--gold-dim);color:var(--text)}
.fb button:disabled{opacity:.6;cursor:default;border-color:var(--green);color:var(--green)}

.rail h4{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);margin:0 0 10px;font-weight:700}
.srcdoc{padding:13px 15px;border:1px solid var(--border);border-radius:11px;background:var(--bg-2);margin-bottom:11px}
.srcdoc .top{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.srcdoc .num{width:18px;height:18px;border-radius:50%;background:var(--gold);color:#1a1206;font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center;flex:none}
.srcdoc .ty{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--cyan)}
.srcdoc .ti{font-weight:600;font-size:13px;margin-bottom:4px}
.srcdoc .fp{font-size:11.5px;color:var(--faint);word-break:break-all}
.srcdoc .score{display:flex;align-items:center;gap:7px;margin-top:7px;font-size:11px;color:var(--muted)}
.srcdoc .bar{flex:1;height:5px;border-radius:5px;background:var(--bg-3);overflow:hidden}
.srcdoc .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--cyan),var(--gold))}
[hidden]{display:none!important}
</style>
</head>
<body>
<header class="topbar">
  <div class="brand">
    <div class="mark">
      <svg viewBox="0 0 40 40" fill="none" width="32" height="32">
        <circle cx="20" cy="20" r="15" stroke="#27406e" stroke-width="1.4"/>
        <path d="M6 26 C 14 22, 13 14, 20 14 S 28 22, 34 16" stroke="#ffc24d" stroke-width="1.8" stroke-linecap="round"/>
        <circle cx="20" cy="20" r="3" fill="#ffc24d"/>
      </svg>
    </div>
    <div class="name">ARI<b>A</b>DNE</div>
  </div>
  <div class="grow"></div>
  <div class="pill" id="srcPill"><span class="dot"></span> <span id="srcName">…</span></div>
  <div class="seg" id="roleSeg" title="Audience-adapted responses">
    <button class="on" data-role="developer">Developer</button>
    <button data-role="product_manager">Product</button>
  </div>
  <button class="iconbtn" id="themeBtn" title="Toggle theme">☾</button>
</header>

<main class="content">
  <div class="hero">
    <div class="inner">
      <h1>Follow the <span class="thread">thread</span> through your codebase.</h1>
      <p class="sub">Ask in plain language. Ariadne answers from its curated docs and themes — grounded in your code, with the ranked sources it drew on.</p>
      <div class="askbox">
        <input id="q" placeholder="Ask Ariadne anything…" autocomplete="off" autofocus>
        <button class="go" id="askBtn">Ask&nbsp;⏎</button>
      </div>
      <div class="chips" id="chips"></div>
    </div>
  </div>

  <div class="status" id="status" hidden></div>

  <div class="answer-grid" id="answerGrid" hidden>
    <div class="card answer" id="answerCard"></div>
    <aside class="rail" id="rail"></aside>
  </div>
</main>

<script>
(function(){
  const $ = id => document.getElementById(id);
  const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g,
    c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  let role = 'developer';
  let lastQuestion = '';
  const DEFAULT_CHIPS = [
    'How does search ranking work?',
    'Where is retry logic handled?',
    'What are the main components?',
  ];

  async function postJSON(path, body){
    const r = await fetch(path, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body:JSON.stringify(body),
    });
    let data = {};
    try { data = await r.json(); } catch(e){ /* non-JSON */ }
    if(!r.ok) throw new Error(data.error || ('HTTP ' + r.status));
    return data;
  }

  // Escape first (XSS-safe), then apply light inline formatting on the escaped
  // text: **bold**, `code`, and paragraph breaks on blank lines.
  function prose(text){
    return esc(text).split(/\n\s*\n/).map(p =>
      '<p>' + p.replace(/`([^`]+)`/g, '<code>$1</code>')
               .replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>')
               .replace(/\n/g, '<br>') + '</p>'
    ).join('');
  }

  function setStatus(msg, isErr){
    const s = $('status');
    if(!msg){ s.hidden = true; return; }
    s.hidden = false; s.className = 'status' + (isErr ? ' err' : '');
    s.innerHTML = isErr ? esc(msg) : '<span class="spin"></span>' + esc(msg);
  }

  function renderChips(list){
    const items = (list && list.length) ? list : DEFAULT_CHIPS;
    $('chips').innerHTML = items.slice(0, 4)
      .map(q => `<span class="chip">${esc(q)}</span>`).join('');
    $('chips').querySelectorAll('.chip').forEach(c =>
      c.addEventListener('click', () => { $('q').value = c.textContent; ask(); }));
  }

  function renderRail(docs){
    const top = (docs || []).slice(0, 6);
    if(!top.length){ $('rail').innerHTML = ''; return; }
    $('rail').innerHTML = '<h4>Sources · ranked</h4>' + top.map((d, i) => {
      const path = (d.source_files && d.source_files[0]) || '';
      const hasScore = typeof d.score === 'number';
      const pct = hasScore ? Math.round(d.score * 100) : 0;
      return `<div class="srcdoc">
        <div class="top"><span class="num">${i+1}</span><span class="ty">${esc(d.content_type||'doc')}</span></div>
        <div class="ti">${esc(d.title)}</div>
        ${path ? `<div class="fp mono">${esc(path)}</div>` : ''}
        ${hasScore ? `<div class="score">match <div class="bar"><i style="width:${pct}%"></i></div> ${d.score.toFixed(2)}</div>` : ''}
      </div>`;
    }).join('');
  }

  function renderAnswer(a, s){
    const docs = (s && s.documents) || [];
    const types = [...new Set(docs.map(d => d.content_type).filter(Boolean))].slice(0, 4);
    const conf = (a.confidence || 'medium').toLowerCase();
    const badges = [
      `<span class="badge conf-${conf}">● ${esc(conf)} confidence</span>`,
      `<span class="badge role">${esc(role === 'product_manager' ? 'product' : 'developer')}</span>`,
      ...types.map(t => `<span class="badge dt">${esc(t)}</span>`),
    ].join('');
    const nudge = (s && s.improvement_hint)
      ? `<div class="nudge">💡 ${esc(s.improvement_hint)}</div>` : '';
    $('answerCard').innerHTML = `
      <div class="meta">${badges}</div>
      ${prose(a.answer)}
      ${nudge}
      <div class="provenance">
        <span>⛓ ${docs.length} ranked source${docs.length===1?'':'s'}</span>
        <span class="fb">
          <button data-fb="1">👍 Helpful</button>
          <button data-fb="0">👎 Miss</button>
        </span>
      </div>`;
    renderRail(docs);
    const eventId = a.event_id;
    $('answerCard').querySelectorAll('.fb button').forEach(btn =>
      btn.addEventListener('click', () => sendFeedback(btn, eventId, btn.dataset.fb === '1')));
    renderChips(s && s.suggested_queries);
    $('answerGrid').hidden = false;
  }

  async function sendFeedback(btn, eventId, helpful){
    const row = btn.parentElement;
    try {
      await postJSON('/api/feedback', {event_id: eventId, helpful});
      row.querySelectorAll('button').forEach(b => b.disabled = true);
      btn.textContent = helpful ? '✓ Logged hit' : '✓ Logged miss';
    } catch(e){ /* leave buttons active on failure */ }
  }

  async function ask(){
    const question = $('q').value.trim();
    if(!question) return;
    lastQuestion = question;
    $('answerGrid').hidden = true;
    $('askBtn').disabled = true;
    setStatus('Following the thread…');
    try {
      const [a, s] = await Promise.all([
        postJSON('/api/ask', {question, role}),
        postJSON('/api/search', {query: question, role}),
      ]);
      setStatus('');
      renderAnswer(a, s);
    } catch(e){
      setStatus('Could not answer: ' + e.message, true);
    } finally {
      $('askBtn').disabled = false;
    }
  }

  // ---- wiring ----
  $('askBtn').addEventListener('click', ask);
  $('q').addEventListener('keydown', e => { if(e.key === 'Enter') ask(); });
  $('roleSeg').querySelectorAll('button').forEach(b =>
    b.addEventListener('click', () => {
      role = b.dataset.role;
      $('roleSeg').querySelectorAll('button').forEach(x =>
        x.classList.toggle('on', x === b));
      if(lastQuestion){ $('q').value = lastQuestion; ask(); }
    }));
  $('themeBtn').addEventListener('click', () => {
    const h = document.documentElement, dark = h.getAttribute('data-theme') === 'dark';
    h.setAttribute('data-theme', dark ? 'light' : 'dark');
    $('themeBtn').textContent = dark ? '☀' : '☾';
  });

  // Show the current default source in the pill (best-effort; empty state ok).
  fetch('/api/sources', {method:'POST', headers:{'Content-Type':'application/json'}, body:'{}'})
    .then(r => r.json())
    .then(d => { $('srcName').textContent = d.default_source || (d.sources && d.sources[0] && d.sources[0].name) || 'no source yet'; })
    .catch(() => { $('srcName').textContent = 'MCP'; });

  renderChips();
})();
</script>
</body>
</html>
